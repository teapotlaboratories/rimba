# Linux infra-STA config for associating to the Rimba mesh-gate's SoftAP built with AP_OPEN=1.
#
# Capture-support only. The shipped gate AP is SAE/PMF; this pairs with the compile-gated open build
# used to expose data-frame payloads to a morse0 monitor (CCMP would hide them).
#
#   sudo wpa_supplicant_s1g -i wlan1 -c wpa-sta-open.conf -B
#   sudo ip addr add 10.9.9.50/24 dev wlan1    # Linux IPs on this bench are NOT persistent
#
# key_mgmt=NONE with no ieee80211w: the open AP advertises neither RSN nor PMF, and leaving a
# key_mgmt=SAE line in place produces an association failure that reads like a wrong passphrase.
ctrl_interface=/var/run/wpa_supplicant_s1g
country=US
network={
    ssid="rimba-ping"
    key_mgmt=NONE
    country="US"
    op_class=68
    channel=27
    s1g_prim_chwidth=0
    s1g_prim_1mhz_chan_index=0
}
