# Secured (SAE) S1G mesh on ssid "rimba-mesh" — for a Linux node to join the ESP PRODUCTION gate's mesh
# (firmware/rimba-halow-mesh-ap uses MESH_ID "rimba-mesh"). Identical to wpa-smesh.conf except the ssid
# ("rimba-mesh" vs "rimba-smesh"); the SAE password (rimbamesh2026) is the same and is compiled into
# morselib, so a Linux node just needs the matching ssid. Used for S6 P2/P3 interop (2026-07-24).
#   key_mgmt=NONE -> key_mgmt=SAE ; add sae_password. user_mpm=1 is required for secured.
ctrl_interface=/var/run/wpa_supplicant_s1g
country=US
user_mpm=1
network={
    ssid="rimba-mesh"
    mode=5                       # WPAS_MODE_MESH
    key_mgmt=SAE                 # secured (was NONE for open)
    sae_password="rimbamesh2026"
    country="US"                 # MUST be quoted
    op_class=68                  # S1G global op-class, ch27 / 1 MHz
    channel=27
    s1g_prim_chwidth=0
    s1g_prim_1mhz_chan_index=0
    dtim_period=1                # REQUIRED (mesh join bails otherwise)
    beacon_int=100
}
