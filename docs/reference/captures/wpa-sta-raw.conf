# Linux infra-STA config for associating to a Rimba ESP32 HaLow SoftAP, with RAW opted in.
#
# Design doc rimba-raw-apside-design.md section 7.6 item 4 called for this and it had never been tracked --
# it existed only as /tmp/wpa-sta*.conf on chronium and chronogen, i.e. on tmpfs, one reboot from gone.
# The S0b-1/S0b-2 analysis scripts were lost exactly that way.
#
#   sudo wpa_supplicant_s1g -i wlan1 -c wpa-sta-raw.conf -B
#   sudo ip addr add 192.168.12.2/24 dev wlan1      # the AP pins 192.168.12.1; Linux IPs are NOT persistent
#
# Two fields are load-bearing and easy to get wrong:
#
#   sae_pwe=2         Hash-to-Element. In this fork it is a GLOBAL field, not per-network. The ESP AP
#                     advertises [SAE-H2E] and REJECTS a default hunt-and-peck commit, so leaving this out
#                     produces an association failure that looks like a wrong passphrase.
#   ieee80211w=2      PMF required, matching the AP's MMWLAN_PMF_REQUIRED. Anything less is rejected.
#
# raw_sta_priority=0 is the STA's only RAW opt-in on Linux. Note it sets the EID-89 QoS Traffic Capability
# UP -- it does NOT set the S1G Capabilities RAW Operation Support bit, which morse_driver unconditionally
# clears on a STA vif. An ESP STA does the opposite. So a Linux STA is not a clean control for the ESP STA
# path; it is fine as a traffic source, which is what S0b-5b uses it for.
ctrl_interface=/var/run/wpa_supplicant_s1g
country=US
sae_pwe=2
network={
    ssid="rimba-rawrps"
    key_mgmt=SAE
    sae_password="rimbahalow"
    ieee80211w=2
    country="US"
    op_class=68
    channel=27
    s1g_prim_chwidth=0
    s1g_prim_1mhz_chan_index=0
    raw_sta_priority=0
}
